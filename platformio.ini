; =============================================================
; SIM-SBUS — ESP32-S3 USB HID Dongle
; Reads SBUS / PPM / PWM (6-ch) from Radiolink R6DS
; and presents as a USB HID Joystick to PC / Steam
;
; Board: ESP32-S3 Black Gold  (use esp32-s3-devkitc-1 profile)
; Connect the USB-OTG port (D+/D- = GPIO20/19) to the PC.
; The UART port (CH340/CP2102) is used only for flashing.
; =============================================================
[platformio]
default_envs = sim-sbus

[env:sim-sbus]
platform  = espressif32
; esp32s3usbotg has build.usb_mode=0 (TinyUSB) natively in boards.txt
; — unlike esp32-s3-devkitc-1 which defaults to usb_mode=1 (HWCDC)
board     = esp32s3usbotg
framework = arduino

; Override board defaults to match Super Mini ESP32-S3 (4MB QIO, no ext-PSRAM needed)
board_build.mcu        = esp32s3
board_build.f_cpu      = 240000000L
board_build.flash_mode = qio             ; Super Mini uses QIO, not DIO
board_build.partitions = max_app_4MB.csv ; 4MB flash, 3.875MB app space

; esp32s3usbotg board manifest keys flash_size under "upload", not "build" —
; board_build.flash_size has no effect; must use board_upload.* here.
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304

; No USB-mode build flags needed — board definition handles usb_mode=0
build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_speed    = 115200
upload_speed     = 921600
upload_protocol  = esptool
