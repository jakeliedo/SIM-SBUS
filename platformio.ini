; =============================================================
; SIM-SBUS — ESP32-S3 USB HID Dongle
; Reads SBUS / PPM / PWM (6-ch) from Radiolink R6DS
; and presents as a USB HID Joystick to PC / Steam
;
; Board: ESP32-S3 Black Gold  (use esp32-s3-devkitc-1 profile)
; Connect the USB-OTG port (D+/D- = GPIO20/19) to the PC.
; The UART port (CH340/CP2102) is used only for flashing.
; =============================================================
[platformio]
default_envs = sim-sbus

[env:sim-sbus]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu            = esp32s3
board_build.f_cpu          = 240000000L
; Change to qio_qspi if your board has no OPI-PSRAM
board_build.arduino.memory_type = qio_opi

build_flags =
    ; Enable TinyUSB (USB-OTG) mode — required for HID
    -DARDUINO_USB_MODE=0
    ; Disable automatic USB-CDC Serial on boot
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Suppress ESP-IDF log noise (set to 4 for debug)
    -DCORE_DEBUG_LEVEL=0

monitor_speed    = 115200
upload_speed     = 921600
upload_protocol  = esptool
